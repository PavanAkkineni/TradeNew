<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - TradeCompass</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/css/login.css">
</head>
<body>
    <!-- Background -->
    <div class="login-bg"></div>
    
    <!-- Login Container -->
    <div class="login-container">
        <div class="back-link">
            <a href="/">← Back to Home</a>
        </div>
        
        <div class="login-card">
            <div class="login-header">
                <div class="logo">📈</div>
                <h1 class="login-title">Welcome Back</h1>
                <p class="login-subtitle">Sign in to access your trading dashboard</p>
            </div>
            
            <div class="error-message" id="error-message"></div>
            <div class="success-message" id="success-message"></div>
            
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input 
                        type="email" 
                        class="form-input" 
                        id="email" 
                        name="email" 
                        placeholder="you@example.com"
                        required
                        autocomplete="email"
                    >
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input 
                        type="password" 
                        class="form-input" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    >
                </div>
                
                <div class="form-options">
                    <div class="checkbox-group">
                        <input type="checkbox" id="remember" name="remember">
                        <label class="checkbox-label" for="remember">Remember me</label>
                    </div>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>
                
                <button type="submit" class="btn btn-primary" id="loginBtn">
                    <span id="loginText">Sign In</span>
                    <span id="loginLoading" style="display: none;" class="loading"></span>
                </button>
            </form>
            
            <div class="divider">or continue with</div>
            
            <div class="social-login">
                <button class="btn-social" onclick="alert('Google login coming soon!')">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M19.6 10.227c0-.709-.064-1.39-.182-2.045H10v3.868h5.382a4.6 4.6 0 01-1.996 3.018v2.51h3.232c1.891-1.742 2.982-4.305 2.982-7.35z" fill="#4285F4"/>
                        <path d="M10 20c2.7 0 4.964-.895 6.618-2.423l-3.232-2.509c-.895.6-2.04.955-3.386.955-2.605 0-4.81-1.76-5.595-4.123H1.064v2.59A9.996 9.996 0 0010 20z" fill="#34A853"/>
                        <path d="M4.405 11.9c-.2-.6-.314-1.24-.314-1.9 0-.66.114-1.3.314-1.9V5.51H1.064A9.996 9.996 0 000 10c0 1.614.386 3.14 1.064 4.49l3.34-2.59z" fill="#FBBC05"/>
                        <path d="M10 3.977c1.468 0 2.786.505 3.823 1.496l2.868-2.868C14.959.99 12.695 0 10 0 6.09 0 2.71 2.24 1.064 5.51l3.34 2.59C5.19 5.736 7.395 3.977 10 3.977z" fill="#EA4335"/>
                    </svg>
                    Sign in with Google
                </button>
                
                <button class="btn-social" onclick="alert('Apple login coming soon!')">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M17.928 14.598c-.266.77-.588 1.477-.967 2.122-.522.888-1.05 1.555-1.583 2.002-.825.754-1.71 1.14-2.656 1.16-.68 0-1.5-.193-2.46-.582-.96-.388-1.844-.582-2.652-.582-.848 0-1.758.194-2.73.582-1.006.388-1.817.591-2.434.611-.906.04-1.81-.357-2.712-1.19-.577-.487-1.136-1.18-1.677-2.082C.352 15.512 0 14.33 0 13.087c0-1.375.298-2.56.893-3.555.473-.794 1.102-1.42 1.887-1.88.785-.459 1.632-.693 2.542-.713.499 0 1.153.154 1.964.46.81.306 1.33.46 1.56.46.172 0 .756-.181 1.75-.543.94-.342 1.734-.484 2.383-.427 1.76.142 3.082.836 3.963 2.085-1.575.954-2.355 2.29-2.34 4.008.014 1.336.5 2.448 1.457 3.335.433.413.917.732 1.453.958-.117.339-.24.664-.372.976zM13.52 1.055c0 1.047-.383 2.025-1.148 2.933-.923 1.075-2.04 1.696-3.252 1.598-.015-.123-.024-.252-.024-.388 0-1.005.438-2.08 1.216-2.96.389-.444.884-.813 1.485-1.107.6-.29 1.168-.45 1.703-.481.015.135.02.27.02.405z"/>
                    </svg>
                    Sign in with Apple
                </button>
            </div>
            
            <div class="signup-link">
                Don't have an account? <a href="/signup.html">Sign up</a>
            </div>
        </div>
    </div>
    
    <script src="static/js/auth.js"></script>
    <script src="static/js/login.js"></script>
    <script>
        // Redirect if already logged in
        redirectIfLoggedIn();
    </script>
</body>
</html>
