<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings - TradeCompass</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/css/landing.css">
    <style>
        .profile-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
        }
        
        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
        }
        
        .profile-title {
            font-size: 2.5rem;
            font-weight: 700;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .profile-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
        }
        
        .card-header {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }
        
        .form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .btn-save {
            padding: 0.875rem 2rem;
            background: var(--gradient-primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body>
    <!-- Background -->
    <div class="animated-bg"></div>
    
    <!-- Header will be automatically created by header.js -->
    
    <!-- Profile Content -->
    <div class="profile-container">
        <div class="profile-header">
            <h1 class="profile-title">Profile Settings</h1>
            <!-- Quick logout button container -->
            <div id="logout-container"></div>
        </div>
        
        <div class="profile-card">
            <h2 class="card-header">Personal Information</h2>
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-input" id="email" readonly>
            </div>
            <div class="form-group">
                <label class="form-label">First Name</label>
                <input type="text" class="form-input" id="firstName" placeholder="Enter your first name">
            </div>
            <div class="form-group">
                <label class="form-label">Last Name</label>
                <input type="text" class="form-input" id="lastName" placeholder="Enter your last name">
            </div>
            <button class="btn-save">Save Changes</button>
        </div>
        
        <div class="profile-card">
            <h2 class="card-header">Security</h2>
            <div class="form-group">
                <label class="form-label">Current Password</label>
                <input type="password" class="form-input" placeholder="Enter current password">
            </div>
            <div class="form-group">
                <label class="form-label">New Password</label>
                <input type="password" class="form-input" placeholder="Enter new password">
            </div>
            <div class="form-group">
                <label class="form-label">Confirm New Password</label>
                <input type="password" class="form-input" placeholder="Confirm new password">
            </div>
            <button class="btn-save">Update Password</button>
        </div>
        
        <div class="profile-card">
            <h2 class="card-header">Account Actions</h2>
            <p style="color: var(--text-secondary); margin-bottom: 1rem;">
                Need to log out? You can use the logout button in the navigation above, or click the button below.
            </p>
            <button onclick="logout()" class="btn-logout" style="margin-top: 1rem;">
                <span>🚪</span> Logout from All Devices
            </button>
        </div>
    </div>
    
    <script src="static/js/auth.js"></script>
    <script src="static/js/header.js"></script>
    <script>
        // Require authentication for profile page
        if (!requireAuth()) {
            // Will redirect to login if not authenticated
        }
        
        // Add quick logout button to the header
        document.addEventListener('DOMContentLoaded', () => {
            addLogoutButton('logout-container');
            
            // Populate email field
            const user = getCurrentUser();
            if (user) {
                document.getElementById('email').value = user.email;
            }
        });
    </script>
</body>
</html>
